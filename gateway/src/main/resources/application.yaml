spring:
  application:
    name: gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: user-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/users/**
            - id: task-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/tasks/**
            - id: streak-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/streaks/**, /api/completions/**

server:
  port: 8080




