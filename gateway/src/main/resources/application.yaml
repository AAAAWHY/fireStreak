spring:
  application:
    name: gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/users/**
            - id: task-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/tasks/**
            - id: streak-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/streaks/**, /api/completions/**
            - id: flame-service
              uri: http://localhost:8084
              predicates:
                  - Path=/api/game/**

server:
  port: 8080

logging:
  level:
    org.springframework.cloud.gateway: TRACE
    org.springframework.security: DEBUG