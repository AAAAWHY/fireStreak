spring:
  application:
    name: task-service

  datasource:
    url: jdbc:mariadb://localhost:3306/task_service
    username: root
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  thymeleaf:
    check-template-location: false

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

eureka:
  client:
    enabled: false

server:
  port: 8082