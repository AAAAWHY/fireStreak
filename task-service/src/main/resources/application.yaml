spring:
  application:
    name: task-service

  datasource:
    url: jdbc:mysql://localhost:3306/task_service
    username: root
    password: ${DB_PASSWORD}

  jpa:
    database: MYSQL
    hibernate:
      ddl-auto: update
    open-in-view: false

  thymeleaf:
    check-template-location: false

eureka:
  client:
    enabled: false