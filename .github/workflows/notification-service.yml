name: Notification Service CI

on:
  push:
    branches: [ "*" ]
    paths:
      - 'notification-service/**'
  pull_request:
    branches: [ "*" ]
    paths:
      - 'notification-service/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Test
        run: cd user-service && mvn test

      - name: Build JAR
        run: cd user-service && mvn package -DskipTests