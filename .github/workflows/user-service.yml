name: User Service CI

on:
  push:
    branches: [main]
    paths:
      - 'user-service/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Test
        run: cd user-service && mvn test

      - name: Build JAR
        run: cd user-service && mvn package -DskipTests